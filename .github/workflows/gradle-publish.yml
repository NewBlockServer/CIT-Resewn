name: 构建与发布

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '26.2'
      - '26.3'
  release:
    types: [created]

# 同一分支/标签上的重复触发排队执行，避免并发写同一个 Release 互相覆盖
concurrency:
  group: build-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5.0.0

      - name: 构建
        run: |
          chmod +x gradlew
          ./gradlew build

      # 版本号从构建产物里读，而不是再解析一遍 gradle.properties：
      # 这样 tag 永远等于 jar 里实际写着的版本，不会和 build.gradle 的
      # "${mod.version}+${minecraft_version}" 拼装逻辑脱节。
      - name: 读取版本号
        id: ver
        run: |
          set -eu
          JAR=""
          for f in build/libs/*.jar; do
            [ -f "$f" ] || continue
            case "$f" in
              *-sources.jar) continue ;;
            esac
            JAR="$f"
            break
          done
          if [ -z "$JAR" ]; then
            echo "::error::未找到构建产物（build/libs/*.jar 为空）"
            exit 1
          fi

          VERSION=$(unzip -p "$JAR" fabric.mod.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')

          # 版本形如 1.0.0+26.3-rc-2：'+' 前是模组版本，后是适配的游戏版本
          MOD="${VERSION%%+*}"
          GAME="${VERSION#*+}"
          [ "$GAME" = "$VERSION" ] && GAME="未知"
          SHORT_SHA=${GITHUB_SHA::7}

          {
            echo "version=$VERSION"
            echo "mod=$MOD"
            echo "game=$GAME"
            echo "sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          echo "产物：$JAR"
          echo "模组：$MOD  游戏：$GAME  提交：$SHORT_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: citresewn-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      # push / 手动触发 -> 生成带版本号的预发布 Release
      # tag 形如 v1.0.0+26.3-rc-2-2e5f7e8（版本 + 短 SHA，保证唯一且可追溯到提交）
      - name: 发布预发布 Release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}
          name: CIT Resewn ${{ steps.ver.outputs.mod }} for ${{ steps.ver.outputs.game }} (${{ steps.ver.outputs.sha }})
          body: |
            | | |
            |---|---|
            | 模组版本 | `${{ steps.ver.outputs.mod }}` |
            | 适配游戏 | `${{ steps.ver.outputs.game }}` |
            | 完整版本 | `${{ steps.ver.outputs.version }}` |
            | 分支 | `${{ github.ref_name }}` |
            | 提交 | ${{ github.sha }} |

            自动构建产物，非正式发布。
          draft: false
          prerelease: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 正式 Release -> 只附加产物，不动 tag / 标题 / 说明（保留手写的发布说明）
      - name: 附加产物到正式 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
