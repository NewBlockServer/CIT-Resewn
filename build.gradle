plugins.apply 'net.fabricmc.fabric-loom'

version = "${property('mod.version')}+${property('minecraft_version')}"
group = 'top.newblock.citresewn'

repositories {
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"

    implementation "net.fabricmc:fabric-loader:${property('deps.fabric-loader')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric-api')}"
    compileOnly "com.terraformersmc:modmenu:${property('deps.modmenu')}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${property('deps.cloth-config')}"
}

loom {
    validateAccessWidener {
        enabled = false
    }

    runConfigs.client.ideConfigGenerated = false
    runConfigs.server.ideConfigGenerated = false
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = property('mod.jarname')
}

processResources {
    inputs.property 'mod_version', version
    inputs.property 'mod_target_mc', project.property('mod.target-mc')

    filesMatching('fabric.mod.json') {
        expand 'mod_version': version, 'mod_target_mc': project.property('mod.target-mc')
    }
}

jar {
    from rootProject.file('LICENSE')
}
